global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'noctis-keepers'
    environment: 'production'

scrape_configs:
  # Keeper 1
  - job_name: 'keeper-1'
    static_configs:
      - targets: ['keeper-1:9091']
        labels:
          keeper: 'keeper-1'
          role: 'primary'

  # Keeper 2
  - job_name: 'keeper-2'
    static_configs:
      - targets: ['keeper-2:9091']
        labels:
          keeper: 'keeper-2'
          role: 'secondary'

  # Keeper 3
  - job_name: 'keeper-3'
    static_configs:
      - targets: ['keeper-3:9091']
        labels:
          keeper: 'keeper-3'
          role: 'backup'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Alertmanager configuration (if needed)
