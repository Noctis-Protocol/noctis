# Persistent Sepolia desk stack (survives Cursor session kills)
#   docker compose --profile monitor up -d --build
#   docker compose --profile monitor logs -f
#   docker compose --profile monitor down
#
# A4: keystore mounted read-only — do NOT bake keys into the image.
#   keystores/keeper.json + KEYSTORE_PASSWORD in .env
# Production: load KEYSTORE_PASSWORD from a secret manager (not plain .env).

services:
  relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noctis-relayer
    env_file:
      - .env
    environment:
      - RELAYER_PORT=3001
      - KEEPER_PRIVATE_KEY_FILE=/run/secrets/keeper.json
      - REQUIRE_KEYSTORE=1
      # Strip plaintext key inside the container even if present in .env
      - KEEPER_PRIVATE_KEY=
      - PRIVATE_KEY=
      - EXPECTED_FEE_RECIPIENT=${EXPECTED_FEE_RECIPIENT:-}
      - EXPECTED_RELAYER=${EXPECTED_RELAYER:-}
      - MIN_KEEPER_ETH=${MIN_KEEPER_ETH:-0.01}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./keystores/keeper.json:/run/secrets/keeper.json:ro
    networks:
      - noctis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/relay/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  monitor:
    profiles: ["monitor"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noctis-ops-monitor
    command: ["npx", "tsx", "src/monitor/index.ts"]
    env_file:
      - .env
    environment:
      - RELAYER_HEALTH_URL=http://relayer:3001/api/relay/health
      - MONITOR_RPC_URL=${MONITOR_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}
      - SUBGRAPH_URL=${SUBGRAPH_URL:-}
      - EXPECTED_RELAYER=${EXPECTED_RELAYER:-}
      # Thresholds
      - MONITOR_MIN_ETH=${MONITOR_MIN_ETH:-0.05}
      - SUBGRAPH_LAG_BLOCKS=${SUBGRAPH_LAG_BLOCKS:-50}
      - STUCK_ORDER_MAX_AGE_MIN=${STUCK_ORDER_MAX_AGE_MIN:-30}
      - CHAIN_STALL_MS=${CHAIN_STALL_MS:-300000}
      # Per-check intervals
      - CHECK_HEALTH_INTERVAL_MS=${CHECK_HEALTH_INTERVAL_MS:-30000}
      - CHECK_RPC_INTERVAL_MS=${CHECK_RPC_INTERVAL_MS:-30000}
      - CHECK_BALANCE_INTERVAL_MS=${CHECK_BALANCE_INTERVAL_MS:-60000}
      - CHECK_PAUSED_INTERVAL_MS=${CHECK_PAUSED_INTERVAL_MS:-60000}
      - CHECK_SUBGRAPH_INTERVAL_MS=${CHECK_SUBGRAPH_INTERVAL_MS:-120000}
      - CHECK_ORDERS_INTERVAL_MS=${CHECK_ORDERS_INTERVAL_MS:-300000}
      # Alerting
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ALERT_COOLDOWN_MS=${ALERT_COOLDOWN_MS:-1800000}
      - ALERT_LOG_PATH=/app/logs/alerts.jsonl
      - MONITOR_STATE_PATH=/app/logs/monitor-state.json
      # Heartbeat
      - HEARTBEAT_ENABLED=${HEARTBEAT_ENABLED:-1}
      - HEARTBEAT_INTERVAL_MS=${HEARTBEAT_INTERVAL_MS:-86400000}
      # Status endpoint (bound to localhost on the host below)
      - MONITOR_STATUS_PORT=3002
      # Monitor does not need the keeper private key
      - KEEPER_PRIVATE_KEY=
      - PRIVATE_KEY=
      - KEEPER_PRIVATE_KEY_FILE=
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      relayer:
        condition: service_healthy
    networks:
      - noctis-network

networks:
  noctis-network:
    driver: bridge
