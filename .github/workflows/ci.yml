name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, uat, prod]
  pull_request:
    branches: [dev, uat, prod]

# Cancel superseded PR/dev runs only — never cancel prod mid-build
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  NODE_VERSION: "24"
  # Next + wagmi/rainbowkit can OOM on the default runner heap
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  protocol:
    name: Protocol (compile + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: noctis-protocol
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: noctis-protocol/package-lock.json

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Stub public env so Next build succeeds in CI
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_placeholder
          NEXT_PUBLIC_VAULT_ADDRESS: "0x6607cE016237C3D8969B318018604c09D16fdd03"
          NEXT_PUBLIC_EXCHANGE_ADDRESS: "0x26f430671554e69EaA9e15112dAb02239B124dCA"
          NEXT_PUBLIC_USDT_ADDRESS: "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238"
          NEXT_PUBLIC_SUBGRAPH_URL: "https://api.studio.thegraph.com/query/0/noctis/0"
          NEXT_PUBLIC_RELAYER_URL: "http://127.0.0.1:3001"
          # Lint already ran above — skip second pass inside next build
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  keeper:
    name: Keeper (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: keeper/package.json

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

  security:
    name: Protocol (Slither)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/prod'
    defaults:
      run:
        working-directory: noctis-protocol
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: noctis-protocol/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Compile
        run: npm run compile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Slither
        run: |
          pip3 install slither-analyzer solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24

      - name: Run Slither
        run: |
          slither . --exclude-dependencies --exclude-informational --exclude-low \
            --json slither-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: noctis-protocol/slither-report.json
          if-no-files-found: ignore
