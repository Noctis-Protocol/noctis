"""
Noctis Protocol Subgraph Schema — V2 (multi-token)

Indexes on-chain activity from the V2 contracts:
- Deposits / Withdrawals (token-generic vault, native ETH = address(0))
- Orders (per-baseToken market orders, privacy-first: no trader, no amounts)
- Per-token cumulative counters (Token entity)
- Protocol fee & gas refund flows (cleartext at settlement)

PRIVACY: V2 events are privacy-scrubbed by design. This subgraph never
indexes anything beyond what the events expose — no trader addresses,
no encrypted amounts.
"""

# Deposit entity - tracks all vault deposits
type Deposit @entity {
  # Unique ID: {txHash}-{logIndex}
  id: ID!

  # User info (deposit txs are public on-chain; event exposes the depositor)
  depositor: Bytes!

  # Asset info
  token: Bytes!                        # Token address (0x0 = native ETH)
  # Amount: ETH deposits use msg.value (public); ERC20 deposit events omit
  # the amount, so 0 is stored until Transfer-based enrichment is wired.
  amount: BigInt!
  amountFormatted: BigDecimal!         # Human-readable (0 when amount unknown)

  # Transaction metadata
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!

  # Relations
  user: User!
  tokenEntity: Token!
}

# Withdrawal status
enum WithdrawalStatus {
  PENDING
  COMPLETED
  CANCELLED
  FAILED
}

# Withdrawal entity - tracks all withdrawal requests
type Withdrawal @entity {
  # Unique ID: {requestId}
  id: ID!

  # Request info
  requestId: BigInt!
  user: Bytes!                         # Payout recipient (stealth exits v2: requester only visible on cancellation)

  # Asset info
  token: Bytes                         # Token address (0x0 = native ETH)
  isEth: Boolean                       # Derived: token == address(0) (kept for frontend compat)
  amount: BigInt                       # Only known after execution (cleartext in event)
  amountFormatted: BigDecimal          # Null when token decimals are unknown

  # Status
  status: WithdrawalStatus!

  # Transaction metadata (request)
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!

  # Completion info (null if pending)
  completedAt: BigInt
  completedTxHash: Bytes

  # Cancellation info (null if not cancelled)
  cancelledAt: BigInt
  cancelledTxHash: Bytes

  # Failure info (null unless execution failed)
  failedAt: BigInt
  failedTxHash: Bytes

  # Relations
  userEntity: User!
  tokenEntity: Token
}

# Order status
enum OrderStatus {
  PENDING
  FILLED
  CANCELLED
  EXPIRED
}

# Order entity - tracks all trading orders
# PRIVACY-FIRST: No trader addresses, no amounts (encrypted on-chain)
type Order @entity {
  # Unique ID: {orderId}
  id: ID!

  # Order identification
  orderId: BigInt!

  # Order details (V2: multi-token, all orders are market orders)
  baseToken: Bytes!                    # Base token of the pair (quote is USDC)
  isBuy: Boolean!                      # true = buy base with USDC, false = sell base

  # Status & lifecycle
  status: OrderStatus!
  createdAt: BigInt!
  createdBlock: BigInt!
  createdTxHash: Bytes!

  # Execution info (null if not filled)
  filledAt: BigInt
  filledBlock: BigInt
  filledTxHash: Bytes

  # Swap execution info (user-initiated flow)
  swapRequested: Boolean               # User requested swap execution
  swapRequestedAt: BigInt

  # Cancellation info (null if not cancelled)
  cancelledAt: BigInt
  cancelledTxHash: Bytes

  # Relations
  tokenEntity: Token!
}

# Token entity - per-token cumulative counters (V2 multi-token registry)
# id = token address (0x0000...0000 = native ETH)
type Token @entity {
  id: ID!

  # Registry state
  vaultEnabled: Boolean!               # From NoctisVaultV2.TokenConfigured
  tradingEnabled: Boolean!             # From NoctisExchangeV2.TradableTokenConfigured
  decimals: Int                        # From vault tokenConfigs (null until configured)

  # Cumulative counters
  totalOrders: Int!                    # Orders with this baseToken
  totalDeposits: Int!
  totalWithdrawals: Int!

  # Fee & gas refund totals (raw amounts in this token's own units)
  totalFeesCollected: BigInt!
  totalFeeEvents: Int!
  totalGasRefundsCollected: BigInt!
  totalGasRefundEvents: Int!

  # Activity timestamps
  firstSeenAt: BigInt!
  lastUpdatedAt: BigInt!

  # Relations
  orders: [Order!]! @derivedFrom(field: "tokenEntity")
  deposits: [Deposit!]! @derivedFrom(field: "tokenEntity")
}

# User entity - aggregates user activity
# NOTE: Derived from deposit/withdrawal events only (which expose addresses).
# Order activity is NOT linked to users for privacy.
type User @entity {
  # Unique ID: {address}
  id: ID!

  # User address (from vault events - already public on-chain)
  address: Bytes!

  # Activity statistics (deposits/withdrawals only - orders are private)
  totalDeposits: Int!
  totalWithdrawals: Int!

  # Volume statistics (legacy field names kept for frontend compat:
  # "ETH" = native token, "USDT" = ERC20 tokens — USDC on V2 Sepolia)
  totalDepositedETH: BigDecimal!
  totalDepositedUSDT: BigDecimal!
  totalWithdrawnETH: BigDecimal!
  totalWithdrawnUSDT: BigDecimal!
  netBalanceETH: BigDecimal!
  netBalanceUSDT: BigDecimal!

  # Activity timestamps
  firstSeenAt: BigInt!
  lastSeenAt: BigInt!

  # Relations (deposits/withdrawals only)
  deposits: [Deposit!]! @derivedFrom(field: "user")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "userEntity")
}

# Global statistics - singleton entity
type GlobalStats @entity {
  # Singleton ID: "global"
  id: ID!

  # User metrics
  totalUsers: Int!

  # Deposit metrics
  totalDeposits: Int!
  totalDepositedETH: BigDecimal!       # Native ETH (public via msg.value)
  totalDepositedUSDT: BigDecimal!      # Legacy name: ERC20 deposits (amounts omitted by events, stays 0)

  # Withdrawal metrics
  totalWithdrawals: Int!

  # Order metrics
  totalOrders: Int!
  totalOrdersFilled: Int!
  totalOrdersCancelled: Int!

  # Token registry metrics
  totalTokens: Int!                    # Tokens ever configured in vault or exchange

  # Fee & gas refund metrics
  # NOTE: amount sums mix token units across tokens; prefer per-Token totals
  # for display. Event counts are unit-safe.
  totalFeesCollected: BigInt!
  totalFeeEvents: Int!
  totalGasRefundsCollected: BigInt!
  totalGasRefundEvents: Int!

  # Activity timestamps
  lastUpdatedAt: BigInt!
}
