specVersion: 0.0.5
description: Noctis Protocol V2 - multi-token FHE dark pool (privacy-first indexing)
schema:
  file: ./schema.graphql
dataSources:
  # NoctisVaultV2 - Token-generic vault (native ETH = address(0))
  # Deployed on Sepolia ~block 11451450 (V2.1 E2E encrypted intents); startBlock set slightly earlier.
  - kind: ethereum/contract
    name: NoctisVaultV2
    network: sepolia
    source:
      address: "0xd44934cD92C5FA8D093e77248A96de9cDa799874"
      abi: NoctisVaultV2
      startBlock: 11451400
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
        - Withdrawal
        - User
        - Token
        - GlobalStats
      abis:
        - name: NoctisVaultV2
          file: ./abis/NoctisVaultV2.json
      eventHandlers:
        # Token-aware deposit (amount intentionally omitted by the event;
        # ETH amount recovered from msg.value which is public anyway)
        - event: Deposited(indexed address,address)
          handler: handleDeposited
        - event: WithdrawalRequested(indexed uint256,address,address,uint256)
          handler: handleWithdrawalRequested
        - event: WithdrawalExecuted(indexed uint256,address,uint256)
          handler: handleWithdrawalExecuted
        - event: WithdrawalCancelled(indexed uint256,address)
          handler: handleWithdrawalCancelled
        - event: WithdrawalExecutionFailed(indexed uint256)
          handler: handleWithdrawalExecutionFailed
        # Token registry (used to track per-token decimals & enabled state)
        - event: TokenConfigured(indexed address,bool)
          handler: handleTokenConfigured
      file: ./src/noctis-vault.ts

  # NoctisExchangeV2 - Multi-token orders (PRIVACY-FIRST: no addresses, no amounts)
  - kind: ethereum/contract
    name: NoctisExchangeV2
    network: sepolia
    source:
      address: "0xD0bf1679e9C59f91AEB5e8c39c6D5b718d89f46e"
      abi: NoctisExchangeV2
      startBlock: 11451400
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Order
        - Token
        - GlobalStats
      abis:
        - name: NoctisExchangeV2
          file: ./abis/NoctisExchangeV2.json
      eventHandlers:
        # V2: orderType removed, baseToken added
        - event: OrderCreated(indexed uint256,indexed address,bool,uint256)
          handler: handleOrderCreated
        - event: OrderFilledSimple(indexed uint256,uint256)
          handler: handleOrderFilledSimple
        # Private fill companion event (ciphertext handles only; used as an
        # idempotent FILLED marker, handles are never stored)
        - event: OrderFilledPrivate(indexed uint256,bytes32,bytes32)
          handler: handleOrderFilledPrivate
        - event: OrderCancelled(indexed uint256,uint256)
          handler: handleOrderCancelled
        # Swap execution request markers (sell path + buy path)
        - event: SwapDecryptionReady(indexed uint256,bytes32[])
          handler: handleSwapDecryptionReady
        - event: BuySufficiencyReady(indexed uint256,bytes32,uint256)
          handler: handleBuySufficiencyReady
        # Fee & gas refund flows (cleartext at settlement)
        - event: ProtocolFeeCollected(indexed uint256,indexed address,uint256,indexed address)
          handler: handleProtocolFeeCollected
        - event: GasRefundCollected(indexed uint256,indexed address,uint256)
          handler: handleGasRefundCollected
        # Tradable token registry
        - event: TradableTokenConfigured(indexed address,bool)
          handler: handleTradableTokenConfigured
      file: ./src/noctis-exchange.ts
